name: App Builder POC - Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID generated by the App Builder backend'
        required: true
        type: string
      platform:
        description: 'Target platform (android or ios)'
        required: true
        type: choice
        default: android
        options:
          - android
          - ios

jobs:
  simulate-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print build info
        run: |
          echo "================================"
          echo "APP BUILDER POC"
          echo "================================"
          echo "Build ID: ${{ inputs.build_id }}"
          echo "Platform: ${{ inputs.platform }}"
          echo "================================"

      - name: Simulate build
        run: |
          echo ""
          echo "Starting build..."
          sleep 2
          echo "Build completed successfully."
