name: App Builder POC - Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Build ID generated by the App Builder backend'
        required: true
        type: string
      platform:
        description: 'Target platform (android or ios)'
        required: true
        type: choice
        default: android
        options:
          - android
          - ios
      ci_token_secret_name:
        description: 'Name of the build-scoped GitHub Actions secret created by the backend'
        required: true
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      BUILD_API_URL: ${{ vars.BUILD_API_URL }}
      BUILD_ID: ${{ inputs.build_id }}
      CI_TOKEN: ${{ secrets[inputs.ci_token_secret_name] }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print build info
        run: |
          echo "================================"
          echo "APP BUILDER POC"
          echo "================================"
          echo "Build ID: ${{ inputs.build_id }}"
          echo "Platform: ${{ inputs.platform }}"
          echo "================================"

      - name: Retrieve authenticated build configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BUILD_API_URL" ] || [ -z "$CI_TOKEN" ]; then
            echo "BUILD_API_URL or the build-scoped CI secret is unavailable."
            exit 1
          fi

          config_file="$RUNNER_TEMP/build-config.json"
          status_code=$(curl --silent --show-error --output "$config_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CI_TOKEN" \
            "$BUILD_API_URL/api/ci/builds/$BUILD_ID/config")

          if [ "$status_code" != "200" ]; then
            echo "The build configuration API returned HTTP $status_code."
            exit 1
          fi

          jq --exit-status '.success == true' "$config_file" > /dev/null
          echo "Authenticated build configuration retrieved."

      - name: Print non-sensitive build configuration
        shell: bash
        run: |
          set -euo pipefail
          config_file="$RUNNER_TEMP/build-config.json"

          echo "================================"
          echo "BUILD CONFIGURATION"
          echo "================================"
          printf 'Build ID: %s\n' "$(jq -r '.data.buildId' "$config_file")"
          printf 'App Name: %s\n' "$(jq -r '.data.config.appName' "$config_file")"
          printf 'Tenant: %s\n' "$(jq -r '.data.config.tenantId' "$config_file")"
          printf 'Environment: %s\n' "$(jq -r '.data.config.environment' "$config_file")"
          printf 'Android Package Name: %s\n' "$(jq -r '.data.config.androidPackageName' "$config_file")"
          printf 'Primary Color: %s\n' "$(jq -r '.data.config.theme.primaryColor' "$config_file")"
          echo "================================"

      - name: Verify supported platform
        run: |
          if [ "${{ inputs.platform }}" != "android" ]; then
            echo "This POC currently supports Android APK generation only."
            exit 1
          fi

      - name: Persist non-secret build configuration
        shell: bash
        run: |
          set -euo pipefail
          jq --exit-status '.success == true and (.data | has("buildId") and has("config"))' \
            "$RUNNER_TEMP/build-config.json" > /dev/null
          jq '.data' "$RUNNER_TEMP/build-config.json" > mobile-app/build-config.json

      - name: Download configured build assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-app/build-assets
          download_asset() { local key="$1" output="$2"; local id; id=$(jq -r ".config.branding.${key}.assetId // empty" mobile-app/build-config.json); if [ -n "$id" ]; then curl --fail --silent --show-error "$BUILD_API_URL/assets/$id.png" --output "$output"; test -s "$output"; fi; }
          download_asset appIconAsset mobile-app/build-assets/app-icon.png
          download_asset splashAsset mobile-app/build-assets/splash.png

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install mobile dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Prepare React Native build configuration
        working-directory: mobile-app
        run: npm run prepare:build

      - name: Build release APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-builder-${{ inputs.build_id }}-android
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
